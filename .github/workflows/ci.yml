name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/web/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/web/pnpm-lock.yaml

      - name: Install Python dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Install, test, and build Vue 3 frontend
        run: |
          pnpm --dir apps/desktop/web install --frozen-lockfile
          pnpm --dir apps/desktop/web test
          pnpm --dir apps/desktop/web build

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run pytest with coverage gate (>=80%)
        run: uv run pytest --cov=lyraforge --cov-report=term-missing --cov-fail-under=80

      - name: Verify fixture generation determinism
        run: |
          uv run python scripts/make_fixtures.py
          git diff --exit-code -- tests/fixtures/midi/

      - name: CLI DryRun smoke test (cross-platform)
        shell: bash
        run: |
          set -euo pipefail
          uv run lyraforge profiles list
          uv run lyraforge inspect tests/fixtures/midi/chords_type1.mid > /dev/null
          uv run lyraforge arrange tests/fixtures/midi/chords_type1.mid -o "${RUNNER_TEMP}/perf.json" --report "${RUNNER_TEMP}/report.json"
          uv run lyraforge validate "${RUNNER_TEMP}/perf.json"
          uv run lyraforge playback dry-run "${RUNNER_TEMP}/perf.json" --log "${RUNNER_TEMP}/actions.jsonl"

  package-windows:
    name: Build Windows Bundle (PyInstaller)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/web/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/web/pnpm-lock.yaml

      - name: Build Vue 3 frontend
        run: |
          pnpm --dir apps/desktop/web install --frozen-lockfile
          pnpm --dir apps/desktop/web build

      - name: Sync runtime & package LyraForge Windows portable bundle
        shell: pwsh
        run: |
          uv sync --frozen --extra desktop
          uv run --with pyinstaller pyinstaller --noconfirm --clean packaging/lyraforge.spec
          if (-not (Test-Path -LiteralPath "dist/LyraForge/LyraForge.exe")) {
            Write-Error "Expected Windows bundle dist/LyraForge/LyraForge.exe was not generated."
            exit 1
          }
          & "dist/LyraForge/LyraForge.exe" --self-check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "LyraForge.exe --self-check failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Package, validate & smoke-test portable Windows ZIP
        shell: pwsh
        run: |
          uv run python scripts/release_helper.py package `
            --bundle-dir dist/LyraForge `
            --output-dir release-dist `
            --license LICENSE `
            --license-audit docs/LICENSE_AUDIT.md `
            --event-name "${{ github.event_name }}" `
            --ref "${{ github.ref }}" `
            --sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zips = @(Get-ChildItem -Path "release-dist" -Filter "LyraForge-*.zip")
          if ($zips.Count -ne 1) {
            Write-Error "Expected exactly 1 release ZIP in release-dist, found $($zips.Count)"
            exit 1
          }
          $smokeDir = Join-Path $env:RUNNER_TEMP "lyraforge-zip-smoke"
          if (Test-Path -LiteralPath $smokeDir) {
            Remove-Item -Recurse -Force $smokeDir
          }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $smokeDir -Force
          $zipExe = Join-Path $smokeDir "LyraForge/LyraForge.exe"
          if (-not (Test-Path -LiteralPath $zipExe)) {
            Write-Error "Extracted ZIP missing LyraForge/LyraForge.exe at $zipExe"
            exit 1
          }
          & $zipExe --self-check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Extracted ZIP LyraForge.exe --self-check failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyraForge-windows-x64
          path: release-dist/
          retention-days: 14

  release-windows:
    name: Publish Windows Release (GitHub Releases)
    needs: [test, package-windows]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified Windows bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: LyraForge-windows-x64
          path: release-dist

      - name: Verify SHA256SUMS & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_helper.py publish \
            --dist-dir release-dist \
            --repo "${GITHUB_REPOSITORY}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --sha "${GITHUB_SHA}" \
            --retain-dev-snapshots 10
