[project]
name = "lyraforge"
version = "0.1.0.dev0"
description = "LyraForge: AI music transcription, smart arrangement & safe instrument playback workbench"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "mido==1.3.3",
    "jsonschema==4.26.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
]

[project.scripts]
lyraforge = "lyraforge.cli:main"

[project.optional-dependencies]
desktop = [
    "pywebview==6.2.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyraforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "realtime: uses the wall clock (slower, timing-tolerant)",
]

[tool.coverage.run]
source = ["lyraforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
